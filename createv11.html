<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Tools v11 - Granular Precision</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 95%;
            max-width: 1400px;
        }
        h1 { color: #1a73e8; margin-top: 0; }
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #444;
        }
        textarea {
            height: 250px;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
            resize: vertical;
        }
        .review-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .output-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid #eee;
        }
        .legend {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 1rem;
            background: #fafafa;
            padding: 0.8rem;
            border-radius: 4px;
        }
        .display-box {
            word-wrap: break-word;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            background: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
            color: #333;
            max-height: 500px;
            overflow-y: auto;
        }
        /* Deep Dive Styles */
        .deep-dive-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .claim-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .claim-card-header {
            background: #f8f9fa;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid #e0e0e0;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .anchor-tag {
            font-size: 0.8rem;
            color: #1a73e8;
            background: #e8f0fe;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            border: 1px solid #c2e7ff;
        }
        .claim-card-body {
            padding: 1rem;
            background: white;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        /* Claim Check Styles */
        .missing {
            color: #d93025;
            background-color: #ffebee;
            font-weight: bold;
            text-decoration: underline;
        }
        /* Wdiff Styles */
        .wdiff-match {
            color: #188038;
            background-color: #e6f4ea;
            font-weight: 500;
        }
        .wdiff-del {
            color: #d93025;
            background-color: #ffebee;
            text-decoration: line-through;
        }
        .wdiff-add {
            color: #70757a;
            background-color: #f1f3f4;
        }
        .paragraph-anchor {
            display: inline-block;
            color: #1a73e8;
            font-weight: bold;
            background: #e8f0fe;
            padding: 0 4px;
            border-radius: 2px;
            margin: 0 2px;
        }
        .status-tag {
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            background: #e8f0fe;
            color: #1967d2;
            margin-left: 10px;
        }
        .virtual-marker {
            color: #e67e22;
            background: #fff3e0;
            border: 1px solid #ffe0b2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Claim Tools v11 <span id="status" class="status-tag">Ready</span></h1>
        
        <div class="input-grid">
            <div class="input-group">
                <label for="summary">Summary (Description)</label>
                <textarea id="summary" placeholder="Paste the description here..."></textarea>
            </div>
            <div class="input-group">
                <label for="claims">Claims (Source of Truth)</label>
                <textarea id="claims" placeholder="Paste the claims here..."></textarea>
            </div>
        </div>
        
        <div class="output-section">
            <h3>0. Preprocessing Review</h3>
            <div class="review-grid">
                <div class="input-group">
                    <label>0.1 Cleaned Summary</label>
                    <div id="preprocessedSummary" class="display-box"></div>
                </div>
                <div class="input-group">
                    <label>0.2 Cleaned Claims (Structural Preview)</label>
                    <div id="preprocessedClaims" class="display-box"></div>
                </div>
            </div>
        </div>

        <div class="output-section">
            <h3>1. Precision Claim Deep Dives (Granular Anchors)</h3>
            <div class="legend">
                Every paragraph is isolated. If markers are missing, virtual anchors like <strong>[0004-V1]</strong> or <strong>[V0001]</strong> are created.
            </div>
            <div id="deepDiveList" class="deep-dive-container"></div>
        </div>

        <div class="output-section">
            <h3>2. Global Claim Check</h3>
            <div id="claimCheck" class="display-box"></div>
        </div>

        <div class="output-section">
            <h3>3. Full Comparison</h3>
            <div id="fullWdiff" class="display-box"></div>
        </div>
    </div>

    <script>
        const summaryInput = document.getElementById('summary');
        const claimsInput = document.getElementById('claims');
        
        const preprocessedSummaryDiv = document.getElementById('preprocessedSummary');
        const preprocessedClaimsDiv = document.getElementById('preprocessedClaims');
        const deepDiveListDiv = document.getElementById('deepDiveList');
        const claimCheckDiv = document.getElementById('claimCheck');
        const fullWdiffDiv = document.getElementById('fullWdiff');
        const statusTag = document.getElementById('status');

        function clean(w) {
            return w.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function preprocessClaims(text) {
            if (!text) return [];
            const claimBlocks = text.split(/^\s*(\d+)\.\s+/gm);
            const claims = [];
            for (let i = 1; i < claimBlocks.length; i += 2) {
                const num = claimBlocks[i];
                let content = claimBlocks[i+1] || "";
                content = content.replace(/ ?\(\d+\)/g, '');
                const introRegex = /^.*?\bclaims?\b.*?,(?=\s*(?:wherein|characterised in that|characterized in that))/gim;
                content = content.replace(introRegex, '');
                const boilerplateRegex = /^\s*(?:characterised|characterized) in that\s+/gim;
                content = content.replace(boilerplateRegex, '');
                const refRegex = /\s+according to (?:any )?(?:one of )?claims? \d+(?: (?:to|,|or) \d+)*/gi;
                content = content.replace(refRegex, '');
                claims.push({ number: num, text: content.trim() });
            }
            return claims;
        }

        function preprocessSummaryIntoParagraphs(text) {
            if (!text) return [];
            
            const parts = text.split(/(\[\d{4}\])/g);
            const paragraphs = [];
            let currentMarker = null;
            let virtualCount = 0;
            let zoneVirtualCount = 0;

            for (let i = 0; i < parts.length; i++) {
                const part = parts[i];
                if (/^\[\d{4}\]$/.test(part)) {
                    currentMarker = part;
                    zoneVirtualCount = 0;
                } else {
                    const content = part.trim();
                    if (content.length === 0) continue;

                    // Smart Break Heuristic: Split by double newlines OR single newline after punctuation
                    const subParts = content.split(/\n\s*\n|(?<=[.!?])\n/);
                    
                    subParts.forEach((sub, idx) => {
                        const subTrimmed = sub.trim();
                        if (subTrimmed.length === 0) return;

                        let label;
                        let isVirtual = false;
                        if (currentMarker) {
                            if (idx === 0 && zoneVirtualCount === 0) {
                                label = currentMarker;
                            } else {
                                zoneVirtualCount++;
                                label = `${currentMarker.slice(0, -1)}-V${zoneVirtualCount}]`;
                                isVirtual = true;
                            }
                        } else {
                            virtualCount++;
                            label = `[V${String(virtualCount).padStart(4, '0')}]`;
                            isVirtual = true;
                        }

                        paragraphs.push({ label, text: subTrimmed, isVirtual });
                    });
                }
            }
            return paragraphs;
        }

        function preprocessSummaryIntoSentences(paragraphs) {
            const sentences = [];
            paragraphs.forEach(para => {
                const rawSentences = para.text.split(/(?<=[.!?])\s+/);
                rawSentences.forEach((s, idx) => {
                    const trimmed = s.trim();
                    if (trimmed.length > 0) {
                        sentences.push({
                            label: para.label,
                            index: idx + 1,
                            text: trimmed,
                            isVirtual: para.isVirtual
                        });
                    }
                });
            });
            return sentences;
        }

        function getLCSMatrix(oldWords, newWords) {
            const matrix = Array(oldWords.length + 1).fill(null).map(() => Array(newWords.length + 1).fill(0));
            for (let i = 1; i <= oldWords.length; i++) {
                const oldClean = clean(oldWords[i-1]);
                for (let j = 1; j <= newWords.length; j++) {
                    const newClean = clean(newWords[j-1]);
                    if (oldWords[i-1] === newWords[j-1] || (oldClean !== '' && oldClean === newClean)) {
                        matrix[i][j] = matrix[i-1][j-1] + 1;
                    } else {
                        matrix[i][j] = Math.max(matrix[i-1][j], matrix[i][j-1]);
                    }
                }
            }
            return matrix;
        }

        function getWdiffHtml(claimText, summaryText, mode = 'wdiff') {
            const cWords = claimText.split(/(\s+)/).filter(x => x.length > 0);
            const sWords = summaryText.split(/(\s+|\[\d{4}(?:-V\d+)?\]|\[V\d{4}\])/).filter(x => x.length > 0);
            const matrix = getLCSMatrix(cWords, sWords);
            
            let html = "";
            let i = cWords.length;
            let j = sWords.length;

            while (i > 0 || j > 0) {
                const oldW = cWords[i-1] || "";
                const newW = sWords[j-1] || "";
                const oldC = clean(oldW);
                const newC = clean(newW);

                if (i > 0 && j > 0 && (oldW === newW || (oldC !== '' && oldC === newC))) {
                    if (mode === 'check') { html = oldW + html; } 
                    else { html = (/\s+/.test(oldW)) ? oldW + html : `<span class="wdiff-match">${oldW}</span>` + html; }
                    i--; j--;
                } else if (j > 0 && (i === 0 || matrix[i][j-1] >= matrix[i-1][j])) {
                    if (mode === 'wdiff') {
                        if (/\[\d{4}(?:-V\d+)?\]|\[V\d{4}\]/.test(newW)) { 
                            const isVirtual = /\[V|-V/.test(newW);
                            const extraClass = isVirtual ? " virtual-marker" : "";
                            html = `<span class="paragraph-anchor${extraClass}">${newW}</span>` + html; 
                        }
                        else if (/\s+/.test(newW)) { html = newW + html; }
                        else { html = `<span class="wdiff-add">${newW}</span>` + html; }
                    }
                    j--;
                } else if (i > 0 && (j === 0 || matrix[i][j-1] < matrix[i-1][j])) {
                    if (/\s+/.test(oldW)) { html = oldW + html; } 
                    else {
                        const cssClass = (mode === 'check') ? 'missing' : 'wdiff-del';
                        html = `<span class="${cssClass}">${oldW}</span>` + html;
                    }
                    i--;
                }
            }
            return html;
        }

        function updateAll() {
            const summaryRaw = summaryInput.value;
            const claimsRaw = claimsInput.value;
            if (!claimsRaw && !summaryRaw) { statusTag.textContent = 'Ready'; return; }
            statusTag.textContent = 'Processing...';

            setTimeout(() => {
                const paragraphs = preprocessSummaryIntoParagraphs(summaryRaw);
                const sentences = preprocessSummaryIntoSentences(paragraphs);
                const claims = preprocessClaims(claimsRaw);
                
                const fullCleanedSummary = paragraphs.map(p => `${p.label} ${p.text}`).join('\n\n');
                preprocessedSummaryDiv.textContent = fullCleanedSummary;
                preprocessedClaimsDiv.textContent = claims.map(c => `Claim ${c.number}:\n${c.text}`).join('\n\n');

                if (claims.length > 0) {
                    let deepDiveHtml = "";
                    claims.forEach(claim => {
                        let bestSentence = sentences[0] || { label: "N/A", index: 0, text: "" };
                        let maxLCS = -1;
                        const cWords = claim.text.split(/\s+/).filter(x => clean(x) !== '');
                        
                        sentences.forEach(s => {
                            const sWords = s.text.split(/\s+/).filter(x => clean(x) !== '');
                            if (sWords.length <= maxLCS) return;
                            const matrix = getLCSMatrix(cWords, sWords);
                            const lcs = matrix[cWords.length][sWords.length];
                            if (lcs > maxLCS) { maxLCS = lcs; bestSentence = s; }
                        });

                        const precisionWdiff = getWdiffHtml(claim.text, bestSentence.text, 'wdiff');
                        const anchorClass = bestSentence.isVirtual ? "anchor-tag virtual-marker" : "anchor-tag";
                        deepDiveHtml += `
                            <div class="claim-card">
                                <div class="claim-card-header">
                                    Claim ${claim.number}
                                    <span class="${anchorClass}">Sentence Anchor: ${bestSentence.label} S${bestSentence.index}</span>
                                </div>
                                <div class="claim-card-body">
                                    <div style="font-size: 0.8rem; color: #666; margin-bottom: 0.5rem; font-style: italic; background: #fdfdfd; padding: 5px; border-radius: 4px;">
                                        <strong>Source Sentence:</strong> ${bestSentence.text}
                                    </div>
                                    ${precisionWdiff}
                                </div>
                            </div>
                        `;
                    });
                    deepDiveListDiv.innerHTML = deepDiveHtml;

                    let checkHtml = "";
                    claims.forEach(c => {
                        checkHtml += `<div><strong>Claim ${c.number}:</strong><br>${getWdiffHtml(c.text, fullCleanedSummary, 'check')}</div><hr>`;
                    });
                    claimCheckDiv.innerHTML = checkHtml;

                    const flattenedClaims = claims.map(c => c.text).join('\n\n');
                    fullWdiffDiv.innerHTML = getWdiffHtml(flattenedClaims, summaryRaw, 'wdiff');
                }
                statusTag.textContent = 'Updated';
            }, 10);
        }

        summaryInput.addEventListener('input', updateAll);
        claimsInput.addEventListener('input', updateAll);
    </script>
</body>
</html>
